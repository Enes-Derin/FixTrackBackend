version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixtrack-backend
    ports:
      - "8080:8080"
    environment:
      # Postgresql & Supabase bilgileri
      DATABASE_NAME=<SUPABASE_DATABASE_NAME>
      DATABASE_USER=<SUPABASE_USER>
      DATABASE_PASSWORD=<SUPABASE_PASSWORD>
      # Cloudinary ortam değişkenleri
      CLOUDINARY_CLOUD_NAME=<CLOUDINARY_CLOUD_NAME>
      CLOUDINARY_API_KEY=<CLOUDINARY_API_KEY>
      CLOUDINARY_API_SECRET=<CLOUDINARY_API_SECRET>
    depends_on: [] # Harici PostgreSQL kullandığınız için boş belirtiliyor